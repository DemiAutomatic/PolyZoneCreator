<!DOCTYPE html>
<html>
  <head>
    <title>ox_lib Zone Creator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" integrity="sha512-gc3xjCmIy673V6MyOAZhIW93xhM9ei1I+gLbmFjUHIjocENRsLX/QUE1htk5q1XV2D/iie/VQ8DXI6Vu8bexvQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      html,
      body,
      #map1 {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        z-index: 1;
        background-color: #143c6a;
      }
      .panel {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        width: 270px;
        padding: 12px 14px 14px;
        border: 1px solid #1a1a1a;
        border-radius: 6px;
        background: rgba(24, 24, 24, 0.94);
        color: #f3f3f3;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .panel h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 650;
      }
      .panel .sub {
        margin: 0 0 12px;
        color: #b0b0b0;
        font-size: 11px;
        line-height: 1.35;
      }
      .panel label {
        display: block;
        margin-bottom: 3px;
        color: #c8c8c8;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .panel .field {
        margin-bottom: 10px;
      }
      .panel input,
      .panel select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        background: #111;
        color: #fff;
        font: inherit;
      }
      .panel .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .panel .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 10px;
        color: #ddd;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        cursor: pointer;
      }
      .panel .check input {
        width: auto;
      }
      .panel .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .btn {
        border-radius: 4px;
        padding: 7px 10px;
        border: 1px solid #202020;
        background: #303030;
        color: white;
        font: inherit;
      }
      .btn:hover {
        cursor: pointer;
        background: #3a3a3a;
      }
      .btn:active {
        background: #404040;
      }
      .btn.on {
        background: #2d6a2d;
        border-color: #245524;
      }
      .btn-wide {
        grid-column: 1 / -1;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 18px;
        z-index: 20;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 4px;
        background: #1b1b1b;
        color: #fff;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .toast.show {
        opacity: 1;
      }
      .zone-popup {
        min-width: 420px;
        max-width: 640px;
      }
      .zone-popup-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .zone-popup-bar strong {
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 13px;
      }
      .zone-lua {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.4;
      }
      .copy-lua {
        padding: 4px 10px;
        border: 1px solid #202020;
        border-radius: 3px;
        background: #303030;
        color: #fff;
        cursor: pointer;
      }
      .leaflet-grid-label .lng {
        margin-left: 8px;
        -webkit-transform: rotate(90deg);
        transform: rotate(90deg);
      }
    </style>
  </head>
  <body>
    <div id="map1"></div>

    <aside class="panel">
      <h1>ox_lib Zone Creator</h1>
      <p class="sub">
        Polygon → poly &nbsp;·&nbsp; Rectangle → box &nbsp;·&nbsp; Circle → sphere
      </p>

      <div class="field">
        <label for="exportFormat">Export format</label>
        <select id="exportFormat" onchange="onExportOptionsChanged()">
          <option value="function">Function (lib.zones)</option>
          <option value="array">Array</option>
          <option value="target">ox_target</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label for="zoneZ">Z</label>
          <input id="zoneZ" type="number" step="0.1" value="30" onchange="onExportOptionsChanged()" />
        </div>
        <div class="field">
          <label for="zoneThickness">Thickness / height</label>
          <input id="zoneThickness" type="number" step="0.1" min="0.1" value="4" onchange="onExportOptionsChanged()" />
        </div>
      </div>

      <label class="check">
        <input id="zoneDebug" type="checkbox" onchange="onExportOptionsChanged()" />
        Export debug = true
      </label>

      <div class="actions">
        <button class="btn" id="btnOverlay" onclick="toggleOverlay()">Overlay Grid</button>
        <button class="btn" onclick="copyAllZones()">Copy All Lua</button>
        <button class="btn btn-wide" onclick="clearLayer()">Clear All</button>
      </div>
    </aside>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js" integrity="sha512-ozq8xQKq6urvuU6jNgkfqAmT7jKN2XumbrX1JiB3TnF7tI48DPI4Gy1GXKD/V3EExgAs1V+pRO7vwtS1LHg0Gw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      var mapMinZoom = 0;
      var mapMaxZoom = 7;
      var mapMaxResolution = 0.25;
      var mapMinResolution = Math.pow(2, mapMaxZoom) * mapMaxResolution;
      var mapCenterLat = -5525;
      var mapCenterLng = 3755;
      var gtaOffset = 0.66;
      var overlay = false;
      var bottomLeft = [-8192, 0];
      var topRight = [0, 8192];
      var bounds = [bottomLeft, topRight];

      function latlngToGTA(latlng) {
        var x = (latlng.lng - mapCenterLng) / gtaOffset;
        var y = (latlng.lat - mapCenterLat) / gtaOffset;
        return [x, y];
      }

      function gtaToLatLng(x, y) {
        var lng = x * gtaOffset + mapCenterLng;
        var lat = y * gtaOffset + mapCenterLat;
        return L.latLng(lat, lng);
      }

      function gtaDistance(a, b) {
        var pa = latlngToGTA(a);
        var pb = latlngToGTA(b);
        return Math.hypot(pa[0] - pb[0], pa[1] - pb[1]);
      }

      L.Draw.Circle = L.Draw.SimpleShape.extend({
        statics: {
          TYPE: "circle",
        },

        options: {
          shapeOptions: {
            stroke: true,
            color: "#3388ff",
            weight: 4,
            opacity: 0.5,
            fill: true,
            fillColor: null,
            fillOpacity: 0.2,
            clickable: true,
          },
          showRadius: true,
          metric: true,
          feet: true,
          nautic: false,
        },

        initialize: function (map, options) {
          this.type = L.Draw.Circle.TYPE;
          this._initialLabelText =
            L.drawLocal.draw.handlers.circle.tooltip.start;
          L.Draw.SimpleShape.prototype.initialize.call(this, map, options);
        },

        _drawShape: function (latlng) {
          var distance = gtaDistance(latlng, this._startLatLng) * gtaOffset;

          if (!this._shape) {
            this._shape = new L.Circle(
              this._startLatLng,
              distance,
              this.options.shapeOptions
            );
            this._map.addLayer(this._shape);
          } else {
            this._shape.setRadius(distance);
          }
        },

        _fireCreatedEvent: function () {
          var circle = new L.Circle(
            this._startLatLng,
            this._shape.getRadius(),
            this.options.shapeOptions
          );
          L.Draw.SimpleShape.prototype._fireCreatedEvent.call(this, circle);
        },

        _onMouseMove: function (e) {
          var latlng = e.latlng;
          this._tooltip.updatePosition(latlng);
          if (this._isDrawing) {
            this._drawShape(latlng);
            var radius = (this._shape.getRadius() / gtaOffset).toFixed(1);
            this._tooltip.updateContent({
              text: this._endLabelText,
              subtext: this.options.showRadius
                ? L.drawLocal.draw.handlers.circle.radius + ": " + radius + "m"
                : "",
            });
          }
        },
      });

      L.Edit.Circle.prototype._resize = function (latlng) {
        var moveLatLng = this._moveMarker.getLatLng();
        var distance = gtaDistance(latlng, moveLatLng);
        var mapRadius = distance * gtaOffset;

        if (this._map._editTooltip) {
          this._map._editTooltip.updateContent({
            text:
              L.drawLocal.edit.handlers.edit.tooltip.subtext +
              "<br />" +
              L.drawLocal.edit.handlers.edit.tooltip.text,
            subtext:
              L.drawLocal.draw.handlers.circle.radius +
              ": " +
              distance.toFixed(1) +
              "m",
          });
        }

        this._shape.setRadius(mapRadius);
        this._map.fire(L.Draw.Event.EDITRESIZE, { layer: this._shape });
      };

      var crs = L.CRS.Simple;
      crs.scale = function (zoom) {
        return Math.pow(2, zoom) / mapMinResolution;
      };

      var layer = L.tileLayer("tiles/{z}/{x}/{y}.png", {
        minZoom: mapMinZoom,
        maxZoom: mapMaxZoom,
        attribution:
          'Rendered with <a href="https://www.maptiler.com/desktop/">MapTiler Desktop</a> by <a href="https://github.com/RussianRonin">RussianRonin</a> | Original by <a href="https://github.com/skyrossm">Skyrossm</a> | ox_lib port by <a href="https://github.com/DemiAutomatic">DemiAutomatic</a>',
        noWrap: true,
        tms: true,
      });

      var map = new L.Map("map1", {
        maxZoom: mapMaxZoom,
        minZoom: mapMinZoom,
        layers: [layer],
        crs: crs,
        center: [mapCenterLat, mapCenterLng],
        zoom: 3,
      });

      L.imageOverlay("https://i.imgur.com/MQr04nZ.jpg", bounds, {
        opacity: 0,
      }).addTo(map);

      function setOverlay() {
        var imagelee = document.querySelector(".leaflet-image-layer");
        if (imagelee) imagelee.style.opacity = overlay ? 0.5 : 0;
      }

      function toggleOverlay() {
        overlay = !overlay;
        document.getElementById("btnOverlay").classList.toggle("on", overlay);
        setOverlay();
      }

      L.Draw.Polyline.prototype._onTouch = L.Util.falseFn;

      var editableLayers = L.featureGroup();
      map.addLayer(editableLayers);
      var drawControl = new L.Control.Draw({
        draw: {
          polyline: false,
          circlemarker: false,
        },
        edit: {
          featureGroup: editableLayers,
        },
      });
      map.addControl(drawControl);

      function fmt(n) {
        return Number(n).toFixed(2);
      }

      function luaIdent(name) {
        var ident = String(name || "zone").replace(/[^A-Za-z0-9_]/g, "_");
        if (!/^[A-Za-z_]/.test(ident)) ident = "zone_" + ident;
        return ident;
      }

      function luaString(value) {
        return String(value || "")
          .replace(/\\/g, "\\\\")
          .replace(/"/g, '\\"');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function getExportOptions() {
        var z = parseFloat(document.getElementById("zoneZ").value);
        var thickness = parseFloat(
          document.getElementById("zoneThickness").value
        );
        return {
          format: document.getElementById("exportFormat").value,
          z: Number.isFinite(z) ? z : 30,
          thickness: Number.isFinite(thickness) && thickness > 0 ? thickness : 4,
          debug: document.getElementById("zoneDebug").checked,
        };
      }

      function debugLine(opts, indent) {
        return opts.debug ? indent + "debug = true,\n" : "";
      }

      function vec3(x, y, z) {
        return "vec3(" + fmt(x) + ", " + fmt(y) + ", " + fmt(z) + ")";
      }

      function parsePoly(name, points, opts) {
        var ident = luaIdent(name);
        var pointLines = points
          .map(function (point) {
            return "\t\t" + vec3(point[0], point[1], opts.z) + ",";
          })
          .join("\n");
        var body =
          '\tname = "' +
          luaString(name) +
          '",\n' +
          "\tpoints = {\n" +
          pointLines +
          "\n\t},\n" +
          "\tthickness = " +
          fmt(opts.thickness) +
          ",\n" +
          debugLine(opts, "\t");

        if (opts.format === "array") {
          return "{\n" + body + "},";
        }
        if (opts.format === "target") {
          return "exports.ox_target:addPolyZone({\n" + body + "})";
        }
        return "local " + ident + " = lib.zones.poly({\n" + body + "})";
      }

      function parseBox(name, box, opts) {
        var ident = luaIdent(name);
        var body =
          '\tname = "' +
          luaString(name) +
          '",\n' +
          "\tcoords = " +
          vec3(box.x, box.y, opts.z) +
          ",\n" +
          "\tsize = " +
          vec3(box.width, box.length, opts.thickness) +
          ",\n" +
          "\trotation = " +
          fmt(box.rotation || 0) +
          ",\n" +
          debugLine(opts, "\t");

        if (opts.format === "array") {
          return "{\n" + body + "},";
        }
        if (opts.format === "target") {
          return "exports.ox_target:addBoxZone({\n" + body + "})";
        }
        return "local " + ident + " = lib.zones.box({\n" + body + "})";
      }

      function parseSphere(name, center, radius, opts) {
        var ident = luaIdent(name);
        var body =
          '\tname = "' +
          luaString(name) +
          '",\n' +
          "\tcoords = " +
          vec3(center[0], center[1], opts.z) +
          ",\n" +
          "\tradius = " +
          fmt(radius) +
          ",\n" +
          debugLine(opts, "\t");

        if (opts.format === "array") {
          return "{\n" + body + "},";
        }
        if (opts.format === "target") {
          return "exports.ox_target:addSphereZone({\n" + body + "})";
        }
        return "local " + ident + " = lib.zones.sphere({\n" + body + "})";
      }

      function rectangleToBox(layer) {
        var rings = layer.getLatLngs();
        var corners = Array.isArray(rings[0]) ? rings[0] : rings;
        var xs = [];
        var ys = [];
        corners.forEach(function (latlng) {
          var point = latlngToGTA(latlng);
          xs.push(point[0]);
          ys.push(point[1]);
        });
        var minX = Math.min.apply(null, xs);
        var maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys);
        var maxY = Math.max.apply(null, ys);
        return {
          x: (minX + maxX) / 2,
          y: (minY + maxY) / 2,
          width: Math.abs(maxX - minX),
          length: Math.abs(maxY - minY),
          rotation: 0,
        };
      }

      function polygonPoints(layer) {
        var rings = layer.getLatLngs();
        var corners = Array.isArray(rings[0]) ? rings[0] : rings;
        return corners.map(latlngToGTA);
      }

      function zoneKindFromLayer(layer, layerType) {
        if (layerType === "circle" || layer instanceof L.Circle) return "sphere";
        if (layerType === "rectangle" || layer instanceof L.Rectangle) return "box";
        if (layerType === "marker" || layer instanceof L.Marker) return "marker";
        return "poly";
      }

      function getLayerLua(layer) {
        var opts = getExportOptions();
        var meta = layer._zone || {};
        var name = meta.name || "zone";
        var kind = meta.kind || zoneKindFromLayer(layer);

        if (kind === "marker") {
          var pos = latlngToGTA(layer.getLatLng());
          return vec3(pos[0], pos[1], opts.z);
        }
        if (kind === "sphere") {
          return parseSphere(
            name,
            latlngToGTA(layer.getLatLng()),
            layer.getRadius() / gtaOffset,
            opts
          );
        }
        if (kind === "box") {
          return parseBox(name, rectangleToBox(layer), opts);
        }
        return parsePoly(name, polygonPoints(layer), opts);
      }

      function popupTitle(kind, format) {
        if (kind === "marker") return "vec3";
        if (format === "target") {
          if (kind === "sphere") return "ox_target:addSphereZone";
          if (kind === "box") return "ox_target:addBoxZone";
          return "ox_target:addPolyZone";
        }
        if (kind === "sphere") return "lib.zones.sphere";
        if (kind === "box") return "lib.zones.box";
        return "lib.zones.poly";
      }

      function bindZonePopup(layer) {
        var lua = getLayerLua(layer);
        layer._lua = lua;
        var kind = (layer._zone && layer._zone.kind) || "poly";
        var format = getExportOptions().format;
        var html =
          '<div class="zone-popup">' +
          '<div class="zone-popup-bar">' +
          "<strong>" +
          escapeHtml(popupTitle(kind, format)) +
          "</strong>" +
          '<button type="button" class="copy-lua">Copy</button>' +
          "</div>" +
          '<pre class="zone-lua">' +
          escapeHtml(lua) +
          "</pre>" +
          "</div>";
        layer.bindPopup(html, { minWidth: 460, maxWidth: 680 });
      }

      function showToast(message) {
        var toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function () {
          toast.classList.remove("show");
        }, 1600);
      }

      function copyText(text) {
        if (!text) {
          showToast("Nothing to copy");
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () {
              showToast("Copied Lua");
            },
            function () {
              fallbackCopy(text);
            }
          );
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
        showToast("Copied Lua");
      }

      function clearLayer() {
        editableLayers.getLayers().forEach(function (drawn) {
          editableLayers.removeLayer(drawn);
        });
      }

      function copyAllZones() {
        var chunks = [];
        editableLayers.eachLayer(function (drawn) {
          if (drawn._zone) chunks.push(getLayerLua(drawn));
        });
        copyText(chunks.join("\n\n"));
      }

      function onExportOptionsChanged() {
        editableLayers.eachLayer(function (drawn) {
          if (drawn._zone) bindZonePopup(drawn);
        });
      }

      function promptName(kind) {
        var labels = {
          poly: "Enter poly zone name:",
          box: "Enter box zone name:",
          sphere: "Enter sphere zone name:",
        };
        var name = prompt(labels[kind] || "Enter zone name:", "");
        if (name === null) return "zone";
        name = name.trim();
        return name || "zone";
      }

      map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        var kind = zoneKindFromLayer(layer, e.layerType);

        if (kind === "marker") {
          layer._zone = { kind: "marker", name: "coords" };
          bindZonePopup(layer);
        } else {
          layer._zone = { kind: kind, name: promptName(kind) };
          bindZonePopup(layer);
          console.log(layer._lua);
        }

        editableLayers.addLayer(layer);
      });

      map.on(L.Draw.Event.EDITED, function (e) {
        e.layers.eachLayer(function (drawn) {
          if (!drawn._zone) {
            drawn._zone = {
              kind: zoneKindFromLayer(drawn),
              name: "zone",
            };
          }
          bindZonePopup(drawn);
        });
      });

      map.on("popupopen", function (e) {
        var popupEl = e.popup.getElement();
        if (!popupEl) return;
        var button = popupEl.querySelector(".copy-lua");
        if (!button) return;
        button.onclick = function () {
          copyText(e.popup._source && e.popup._source._lua);
        };
      });
    </script>
  </body>
</html>
